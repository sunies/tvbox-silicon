name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: macos-build
  cancel-in-progress: true

jobs:
  macos:
    # ColorfulX 6.2.1 needs swift-tools-version 6.2, so the runner must ship Xcode 26
    # (macos-15 images top out at Xcode 16).
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Install toolchain
        run: |
          brew install xcodegen
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build hosts (Java, Node, Python)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          Scripts/build-java-host.sh
          Scripts/build-script-host.sh
          Scripts/build-python-host.sh

      - name: Build FFmpeg and libass
        run: |
          Scripts/build-apple-ffmpeg.sh
          Scripts/build-apple-libass.sh

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project TVBox.xcodeproj \
            -scheme TVBox-macOS \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Package
        run: |
          APP="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          echo "Built: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "guangying-macos-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: guangying-macos
          path: guangying-macos-*.zip
          retention-days: 14
