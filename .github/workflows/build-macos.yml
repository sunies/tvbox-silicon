name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (macos-26, macos-26-xlarge, macos-26-intel ...)
        default: macos-26
        required: false
  push:
    branches: [main]

concurrency:
  group: macos-build
  cancel-in-progress: true

jobs:
  macos:
    # ColorfulX 6.2.1 needs swift-tools-version 6.2, so the runner must ship Xcode 26
    # (macos-15 images top out at Xcode 16). The arm64 macos-26 label often has no
    # capacity, so workflow_dispatch can point a manual run at another label.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Install toolchain
        run: |
          brew install xcodegen
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Read build signatures
        run: |
          # The vendor scripts cache one build per recipe, keyed by a hash of the lines between
          # "# RECIPE" and "# END". Exposing that key lets Actions keep the built xcframeworks.
          echo "FFMPEG_SIG=$(sed -n '/^# RECIPE$/,/^# END$/p' Scripts/build-apple-ffmpeg.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_ENV"
          echo "LIBASS_SIG=$(sed -n '/^# RECIPE$/,/^# END$/p' Scripts/build-apple-libass.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_ENV"

      # FFmpeg + libass take about 21 of the run's 23 minutes, and the recipes change rarely.
      - name: Restore FFmpeg and libass builds
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg/${{ env.FFMPEG_SIG }}
            ~/Library/Caches/tvbox-libass/${{ env.LIBASS_SIG }}
          key: vendor-${{ env.FFMPEG_SIG }}-${{ env.LIBASS_SIG }}

      - name: Build hosts (Java, Node, Python)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          Scripts/build-java-host.sh
          Scripts/build-script-host.sh
          Scripts/build-python-host.sh

      - name: Build FFmpeg and libass
        run: |
          Scripts/build-apple-ffmpeg.sh
          Scripts/build-apple-libass.sh

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project TVBox.xcodeproj \
            -scheme TVBox-macOS \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Package
        run: |
          APP="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          echo "Built: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "guangying-macos-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: guangying-macos
          path: guangying-macos-*.zip
          retention-days: 14
